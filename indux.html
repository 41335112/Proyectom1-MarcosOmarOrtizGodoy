<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>

<body>
    <main class="contenedor">
         
        <header class="titulo">
            <img src="assets/img/Colorfly-Studio.png.png" alt="foto" width="300"/>
            
            <div class="texto">
                <h1 class="tituloPrincipal">Agencia Colorfly Studio</h1>
                <p1>Generador De Paletas De Colores</p1>
            </div>
            
        </header>

        <div class="configuracion">
           <section class="opciones">
             <label for="cantidad">Cantidad de Colores </label>
              
              <select id="cantidad">
                <option value="6"> 6 colores </option>
                <option value="8"> 8 colores </option>
                <option value="9"> 9 colores </option>
              </select>

            </section>

           <section class="formato">
             <label for="formato">Seleccionar Formato</label>
             <select id="formato">
                <option value="hex"> Formato Hex </option>
                <option value="rgba"> Formato Rgba </option>
             </select>
           </section>
        </div>

        <div class="botones">
         <button class="generar">Generar paleta de colores </button>
         <button class="guardar"> Guardar paleta de colores </button>
         <button class="eliminar"> Eliminar paletas de colores </button>
        </div>
    </main>

    <footer>
        <p>La Agencia de colorfly Studio es una empresa que se encarga de producir
            propuestas visuales para mas de 300 clientes en distintas cuidades del pais y del mundo. 
        </p>
    </footer>

</body>
</html>
